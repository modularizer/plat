name: Publish

# npm packages are published from the release machine (`node scripts/release.mjs
# --publish` runs scripts/publish-npm.mjs) because npm trusted publishing is not
# configured for these packages and GitHub's token is not an npm credential — npm
# answers the PUT with 404. PyPI is published here, on the release event.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pypi: ${{ steps.plan.outputs.pypi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover release targets
        id: plan
        run: node scripts/packages.mjs --plan >> "$GITHUB_OUTPUT"
      - name: Show release targets
        run: node scripts/packages.mjs

  publish-pypi:
    needs: plan
    if: needs.plan.outputs.pypi != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pypi) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: |
          pip install build pytest pytest-asyncio
          pip install -e .
      - name: Test
        if: matrix.hasTests
        working-directory: ${{ matrix.dir }}
        run: pytest tests/
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.dir }}/dist
